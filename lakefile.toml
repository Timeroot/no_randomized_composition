name = "NoisyR"
version = "0.1.0"
defaultTargets = ["ForMathlib", "QueryComplexity", "Solution"]

[leanOptions]
linter.mathlibStandardSet = true
linter.flexible = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "QueryComplexity"

[[lean_lib]]
name = "ForMathlib"

[[lean_lib]]
name = "Main"
globs = ["Main.+"]

[[lean_lib]]
name = "Solution"
